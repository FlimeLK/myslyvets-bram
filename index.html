<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мисливець Брам</title>
<meta name="description" content="Українська рольова гра в Telegram: переродися мисливцем, зачищай брами, бийся на арені й дійди до рангу S.">
<meta name="theme-color" content="#04060d">
<meta property="og:title" content="Мисливець Брам">
<meta property="og:description" content="Українська рольова гра в Telegram: переродися мисливцем, зачищай брами, бийся на арені й дійди до рангу S.">
<meta property="og:image" content="https://flimelk.github.io/myslyvets-bram/avatar.png">
<meta property="og:url" content="https://flimelk.github.io/myslyvets-bram/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2304060d'/%3E%3Cpath d='M6 20V11a6 6 0 0 1 12 0v9' fill='none' stroke='%2362d0ff' stroke-width='2.2'/%3E%3Cpath d='M9 20v-8a3 3 0 0 1 6 0v8z' fill='%238a6cff'/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
html,body{overscroll-behavior:none}
/* Layout: one phone-width column (max 520px) of glowing "System" windows; sticky hunter bar on top, tab bar fixed to the bottom. Single dark world by design. */
:root{
  --void:#04060d; --deep:#070c1a; --panel:#0b1428; --panel-hi:#10203f; --well:#060b17;
  --line:#22416f; --line-hi:#3b7cc9; --sys:#62d0ff; --sys-dim:#2f86c6; --sys-ghost:rgba(98,208,255,.10);
  --ink:#e3ecff; --ink-2:#a6b7d8; --ink-3:#6d80a5;
  --gold:#f3c560; --gold-deep:#a97a1c; --crimson:#ec4660; --crimson-deep:#9e2238; --mana:#4b9dff; --xp:#9a7cff; --heal:#46d68c; --warn:#ffb547;
  --r0:#c9d3e6; --r1:#59d68a; --r2:#4aa3ff; --r3:#b06cff; --r4:#ff9f3d; --r5:#ff4d6d;
  --f-display:"Tektur","Russo One","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(110% 55% at 50% -12%, rgba(42,74,160,.42) 0%, transparent 62%),
    repeating-linear-gradient(0deg, rgba(98,208,255,.03) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(98,208,255,.03) 0 1px, transparent 1px 34px),
    var(--void);
  min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-2)}
.faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(4,7,15,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(59,124,201,.28)}
.topin{display:flex;align-items:center;gap:10px;padding-block:8px}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-width:0;flex:1;text-align:left}
.me-t{display:flex;flex-direction:column;min-width:0}
.me-t b{font:600 14px/1.15 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--line);background:rgba(10,20,40,.8);border-radius:3px;font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{font-style:normal;color:var(--ink-3);font-weight:500}
.chip.en .ic{color:var(--gold)} .chip.gold .ic{color:var(--gold)} .chip.cry .ic{color:#b48cff}

/* ---------- avatar / sigils ---------- */
.ava{--rc:var(--ink-3);position:relative;display:grid;place-items:center;width:40px;height:40px;flex:none;color:var(--rc);
  clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%);background:linear-gradient(160deg,rgba(98,208,255,.18),rgba(5,10,22,.95) 60%);}
.ava::before{content:"";position:absolute;inset:0;clip-path:inherit;background:var(--rc);opacity:.55;
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px}
.ava .ic{width:58%;height:58%;filter:drop-shadow(0 0 6px currentColor)}
.ava.big{width:76px;height:76px}
.ava.xl{width:112px;height:112px}
.rk{--rc:var(--ink-3);display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border:1.5px solid var(--rc);color:var(--rc);font:700 13px/1 var(--f-display);box-shadow:0 0 10px color-mix(in srgb,var(--rc) 45%,transparent),inset 0 0 8px color-mix(in srgb,var(--rc) 30%,transparent);background:rgba(4,8,18,.7)}
.rank-E{--rc:#9fb0c8}.rank-D{--rc:#59d68a}.rank-C{--rc:#4aa3ff}.rank-B{--rc:#b06cff}.rank-A{--rc:#ff9f3d}.rank-S{--rc:#ff4d6d}

/* ---------- System windows ---------- */
.win{position:relative;margin-top:24px;padding:26px 14px 14px;border:1px solid var(--line);border-radius:3px;
  background:linear-gradient(180deg,rgba(16,30,60,.9),rgba(8,15,32,.94));
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 26px rgba(47,134,198,.14),inset 0 0 30px rgba(98,208,255,.05)}
.win.tight{padding:22px 12px 12px}
.plate{position:absolute;top:-14px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:6px 14px;max-width:calc(100% - 24px);
  background:var(--deep);border:1px solid var(--sys-dim);box-shadow:0 0 14px rgba(98,208,255,.32),inset 0 0 10px rgba(98,208,255,.14);
  font:600 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.plate .i{display:grid;place-items:center;width:17px;height:17px;border:1.5px solid currentColor;border-radius:50%;font:700 10px/1 var(--f-display);letter-spacing:0;flex:none}
.plate.gold{border-color:var(--gold-deep);box-shadow:0 0 14px rgba(243,197,96,.35),inset 0 0 10px rgba(243,197,96,.14);color:var(--gold)}
.plate.red{border-color:var(--crimson-deep);box-shadow:0 0 14px rgba(236,70,96,.4),inset 0 0 10px rgba(236,70,96,.16);color:#ff8fa0}
.sys-text p{margin:0 0 8px}
.sys-text p:last-child{margin-bottom:0}
.sys-text .warn{color:#ff8fa0}
.sys-text .cy{color:var(--sys)}
.lead{font-size:14px;color:var(--ink-2);margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid var(--line-hi);border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,#132a50,#0b1933);color:var(--ink);font:600 14px/1.1 var(--f-display);letter-spacing:.05em;text-align:center;transition:filter .15s,transform .08s,box-shadow .15s}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(98,208,255,.22)}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.off{opacity:.42;cursor:not-allowed;filter:grayscale(.5)}
.btn.blue{background:linear-gradient(180deg,#3a7df0,#2251b5);border-color:#6aa4ff;box-shadow:0 0 18px rgba(74,140,255,.35)}
.btn.gold{background:linear-gradient(180deg,#f8d77c,#d9a336);border-color:#ffe6a0;color:#2a1a02;box-shadow:0 0 18px rgba(243,197,96,.35)}
.btn.red{background:linear-gradient(180deg,#e2475f,#a92740);border-color:#ff8a9c;box-shadow:0 0 18px rgba(236,70,96,.35)}
.btn.ghost{background:rgba(6,12,26,.6)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12.5px}
.btn.wide{width:100%}
.btn .cost{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:12.5px;opacity:.95}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:grid;gap:8px}
.spacer{height:10px}

/* ---------- bars ---------- */
.bar{position:relative;height:18px;background:#0a1222;border:1px solid #1b2c4c;border-radius:2px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--c,var(--crimson));box-shadow:0 0 12px var(--c,var(--crimson));transition:width .35s ease}
.bar>span{position:relative;display:block;text-align:center;font:600 11.5px/16px var(--f-mono);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 2px #000,0 0 4px rgba(0,0,0,.9),0 0 1px #000}
.bar.hp{--c:linear-gradient(90deg,#b5203b,#f0566f)}
.bar.mp{--c:linear-gradient(90deg,#2559c8,#57a6ff)}
.bar.xp{--c:linear-gradient(90deg,#5b3fd0,#a88bff)}
.bar.en{--c:linear-gradient(90deg,#c98a1f,#f6d06e)}
.bar.thin{height:8px}
.bar.thin>span{display:none}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin:6px 0 3px}

/* ---------- hunter ---------- */
.hhead{display:flex;gap:14px;align-items:center}
.hname{font:700 22px/1.1 var(--f-display);letter-spacing:.02em;margin:0;overflow-wrap:anywhere}
.hcls{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.lvline{display:flex;align-items:center;gap:10px;margin-top:8px}
.lvline .lv{font:700 13px/1 var(--f-display);color:var(--ink-2);letter-spacing:.08em}
.lvline .lv b{font-size:26px;color:var(--sys);text-shadow:0 0 14px rgba(98,208,255,.6);margin-left:4px;vertical-align:-3px}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px;margin-top:14px;border-top:1px solid rgba(59,124,201,.22);padding-top:10px}
.cgrid .c{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px dashed rgba(59,124,201,.16);min-width:0}
.cgrid .c .ic{color:var(--sys);opacity:.85}
.cgrid .c span{font:600 11px/1.2 var(--f-display);letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase;flex:1;min-width:0}
.cgrid .c b{font:700 14px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.pw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pcell{border:1px solid var(--line);background:rgba(6,12,26,.6);padding:8px 10px;border-radius:3px;text-align:left;cursor:pointer}
.pcell small{display:block;font-size:12px;color:var(--ink-2)}
.pcell b{font:700 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;min-height:46px;border:1px solid var(--line);background:rgba(6,12,26,.55);border-radius:3px;cursor:pointer;text-align:left}
.st.on{border-color:var(--gold);box-shadow:0 0 12px rgba(243,197,96,.25)}
.st span{font:700 12px/1 var(--f-display);letter-spacing:.1em;color:var(--sys);flex:1}
.st b{font:700 17px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.st .plus{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--gold-deep);background:rgba(243,197,96,.12);color:var(--gold);border-radius:2px;cursor:pointer;padding:0}
.st.pts span{color:var(--gold)}
.statinfo{margin-top:10px;padding:10px 12px;border:1px dashed var(--line-hi);background:rgba(10,20,44,.6);font-size:13.5px;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:10px 0 0}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.inv .it{display:flex;align-items:center;gap:6px;font:600 14px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:0}
.inv .it small{font:500 11px/1.2 var(--f-body);color:var(--ink-3);display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tile{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border:1px solid var(--line);background:linear-gradient(180deg,#112449,#0b1833);border-radius:3px;cursor:pointer;font:600 14px/1.1 var(--f-display);letter-spacing:.03em;text-align:left}
.tile .ic{width:22px;height:22px;color:var(--sys);filter:drop-shadow(0 0 6px rgba(98,208,255,.5))}
.tile.red{background:linear-gradient(180deg,#5a1626,#3a0e19);border-color:#a8344b}
.tile.red .ic{color:#ff8fa0}
.tile.goldt{background:linear-gradient(180deg,#5a4614,#3a2c0b);border-color:#a8822e}
.tile.goldt .ic{color:var(--gold)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.badge{position:absolute;top:6px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crimson);font:700 11px/18px var(--f-mono);text-align:center}

/* ---------- gates ---------- */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.farmcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:1px solid var(--line);background:linear-gradient(180deg,#14234a,#0b1630);border-radius:3px;cursor:pointer;text-align:left}
.farmcard b{font:700 14px/1.1 var(--f-display);display:flex;gap:6px;align-items:center}
.farmcard small{color:var(--ink-2);font-size:12px}
.rankhead{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);background:rgba(10,18,38,.85);border-radius:3px;cursor:pointer;text-align:left}
.rankhead.lock{opacity:.6}
.rankhead .t{flex:1;min-width:0}
.rankhead .t b{display:block;font:700 15px/1.2 var(--f-display);letter-spacing:.04em}
.rankhead .t small{color:var(--ink-2);font-size:12.5px}
.rankhead .chev{transition:transform .2s;color:var(--ink-3)}
.rankhead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.medal{--rc:var(--ink-3);display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;font:700 15px/1 var(--f-display);color:#e9f2ff;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 55%,#0a1020) 0%,#060a16 70%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 80%,transparent),0 0 0 5px rgba(8,14,30,.9),0 0 0 6px color-mix(in srgb,var(--rc) 45%,transparent),0 0 18px color-mix(in srgb,var(--rc) 45%,transparent)}
.gate{position:relative;display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:3px;
  background:linear-gradient(100deg,rgba(18,34,70,.95),rgba(10,18,38,.95))}
.gate::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--gbg,none);opacity:.35;mix-blend-mode:screen}
.gate.trial{border-color:#8a6a2a;background:linear-gradient(100deg,rgba(60,44,14,.6),rgba(14,16,30,.95))}
.gate.lock{opacity:.55}
.gate .t{flex:1;min-width:0}
.gate .t b{display:block;font:700 15px/1.2 var(--f-display);letter-spacing:.03em}
.gate .t small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.gate .t .mobs{color:var(--ink-3);font-size:12px;margin-top:3px}
.gate .done{font:600 11px/1 var(--f-display);color:var(--heal);letter-spacing:.06em}
.lockbtn{display:inline-flex;gap:5px;align-items:center;padding:8px 10px;border:1px solid #2a3a5a;color:var(--ink-3);font:600 12.5px/1 var(--f-display);border-radius:3px;white-space:nowrap}
.enrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg{padding:10px;border:1px solid var(--line);background:rgba(6,12,26,.5);border-radius:3px;cursor:pointer;font:600 13.5px/1 var(--f-display)}
.seg.on{border-color:var(--sys);background:rgba(47,134,198,.18);box-shadow:inset 0 0 12px rgba(98,208,255,.18)}

/* ---------- arena ---------- */
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bigstats small{display:block;color:var(--ink-2);font-size:12.5px}
.bigstats b{font:700 30px/1.2 var(--f-display);letter-spacing:.04em;text-shadow:0 0 16px rgba(98,208,255,.35)}
.opp{display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);background:rgba(10,18,38,.88);border-radius:3px}
.opp .t{flex:1;min-width:0}
.opp .t b{display:block;font:700 15px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .t small{color:var(--ink-2);font-size:12.5px}
.opp.me{border-color:var(--gold-deep);background:rgba(60,44,14,.35)}
.opp .pos{font:700 14px/1 var(--f-mono);color:var(--ink-3);width:22px;text-align:right}
.tag-live{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--heal);color:var(--heal);font:600 10px/1.3 var(--f-display);letter-spacing:.06em;vertical-align:2px}

/* ---------- bag ---------- */
.doll{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:start}
.doll .col{display:grid;gap:8px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:6px 4px;border:1px solid var(--line);background:rgba(6,12,26,.6);border-radius:3px;cursor:pointer;text-align:center}
.slot .ic{width:24px;height:24px;color:var(--ink-3)}
.slot small{font-size:11px;color:var(--ink-3);line-height:1.15}
.slot.has{border-color:var(--rcol);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rcol) 22%,transparent)}
.slot.has .ic{color:var(--rcol);filter:drop-shadow(0 0 5px var(--rcol))}
.slot.has small{color:var(--ink)}
.slot .lv{position:absolute;left:4px;top:4px;font:600 10px/1 var(--f-mono);color:var(--ink-3)}
.slot .up{position:absolute;right:4px;top:3px;font:700 10px/1 var(--f-mono);color:var(--gold)}
.dollmid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px;text-align:center}
.dollmid .pow{font:700 22px/1 var(--f-mono)}
.dollmid small{color:var(--ink-2);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);background:rgba(6,12,26,.5);border-radius:2px;cursor:pointer;font:600 12px/1 var(--f-display)}
.fchip.on{border-color:var(--sys);background:rgba(47,134,198,.2)}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border:1px solid var(--rcol,#22416f);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rcol) 18%,#0b1428),#070d1c 75%);border-radius:3px;cursor:pointer;padding:0}
.cell .ic{width:46%;height:46%;color:var(--rcol);filter:drop-shadow(0 0 5px var(--rcol))}
.cell .lv{position:absolute;left:4px;bottom:3px;font:600 10px/1 var(--f-mono);color:var(--ink-2)}
.cell .up{position:absolute;right:4px;top:3px;font:700 10px/1 var(--f-mono);color:var(--gold)}
.cell .new{position:absolute;left:3px;top:3px;padding:1px 3px;background:var(--sys-dim);font:700 8.5px/1.2 var(--f-display);letter-spacing:.05em;border-radius:2px}
.cell .better{position:absolute;right:3px;bottom:3px;color:var(--heal);font:700 11px/1 var(--f-mono)}
.empty{padding:18px 10px;text-align:center;color:var(--ink-3);font-size:13.5px;border:1px dashed var(--line);border-radius:3px}
.itemhead{display:flex;gap:12px;align-items:center}
.itemhead .cell{width:64px;flex:none}
.itemhead b{display:block;font:700 17px/1.2 var(--f-display);color:var(--rcol)}
.itemhead small{color:var(--ink-2);font-size:12.5px}
.statlist{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.statlist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed rgba(59,124,201,.16)}
.statlist li b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.statlist li.af span{color:#c9b6ff}
.delta{font:600 12px var(--f-mono);margin-left:6px}
.delta.up{color:var(--heal)} .delta.dn{color:var(--crimson)}

/* ---------- menu ---------- */
.mgroup{margin-top:18px}
.mgroup h3{font:700 11.5px/1 var(--f-display);letter-spacing:.16em;color:var(--sys);text-transform:uppercase;margin:0 0 8px}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:78px;padding:10px 6px;border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;cursor:pointer;font-size:13px;text-align:center}
.mt .ic{width:26px;height:26px;color:var(--sys);filter:drop-shadow(0 0 7px rgba(98,208,255,.55))}
.setrow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;margin-top:8px}
.setrow span{flex:1}
.setrow small{display:block;color:var(--ink-3);font-size:12px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;border:1px solid var(--line-hi);background:#0a1426;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#5a6d92;transition:left .18s,background .18s}
.sw[aria-checked="true"]{background:rgba(47,134,198,.4)}
.sw[aria-checked="true"]::after{left:23px;background:var(--sys);box-shadow:0 0 10px var(--sys)}
.subhead{display:flex;align-items:center;gap:10px;margin-top:12px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);background:rgba(6,12,26,.7);border-radius:3px;cursor:pointer;font:600 13px/1 var(--f-display)}
.subhead h2{font:700 18px/1.2 var(--f-display);letter-spacing:.06em;margin:0;text-transform:uppercase}

/* ---------- quest ---------- */
.qrow{padding:10px 0;border-bottom:1px solid rgba(59,124,201,.18)}
.qrow .qt{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:14.5px}
.qrow .qt b{font-family:var(--f-mono)}
.qrow.done .qt span::before{content:"✓ ";color:var(--heal)}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sys)}
.reward{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;font:600 14px/1 var(--f-mono)}
.reward .r{display:inline-flex;gap:4px;align-items:center}
.reward .lab{font:600 13px var(--f-body);color:var(--gold)}

/* ---------- skills ---------- */
.skill{display:flex;gap:12px;padding:12px;border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;margin-top:8px}
.skill.lock{opacity:.6}
.skill .sk-ic{display:grid;place-items:center;width:42px;height:42px;flex:none;border:1px solid var(--line-hi);background:radial-gradient(circle,#1a3a70,#081226);border-radius:3px;color:var(--sys)}
.skill .sk-ic .ic{width:24px;height:24px;filter:drop-shadow(0 0 6px currentColor)}
.skill .t{flex:1;min-width:0}
.skill .t b{display:block;font:700 15px/1.2 var(--f-display);color:#8fd8ff;margin-bottom:3px}
.skill .t p{margin:0;font-size:13.5px;color:var(--ink-2)}
.skill .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px;color:#8fb8ff}
.skill .meta .lk{color:var(--gold)}
.ult{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--gold);color:var(--gold);font:600 10px/1.4 var(--f-display);letter-spacing:.06em;vertical-align:2px;border-radius:2px}

/* ---------- wheel ---------- */
.wheelbox{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:6px auto 0}
.wheelbox svg.wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.72,.08,1);filter:drop-shadow(0 0 18px rgba(98,208,255,.35))}
.wheelbox .ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold);filter:drop-shadow(0 0 6px var(--gold));z-index:2}
.wheelbox .hub{position:absolute;inset:38%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1d3e7a,#060b18 70%);border:2px solid var(--sys-dim);box-shadow:0 0 20px rgba(98,208,255,.5)}
.wheelbox .hub .ic{width:46%;height:46%;color:var(--sys)}

/* ---------- class pick / intro ---------- */
#intro{position:fixed;inset:0;z-index:70;overflow-y:auto;background:#020308;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.crash{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:40px;
  background:radial-gradient(70% 50% at 70% 30%,rgba(140,10,30,.32),transparent 70%),radial-gradient(60% 40% at 20% 80%,rgba(110,8,24,.28),transparent 70%),#030206}
.crash p{font-size:17px;color:#cdd3e4;margin:0 0 14px;opacity:0;transform:translateY(6px);animation:fadeUp .7s ease forwards}
.crash .truck{font:800 clamp(34px,10vw,52px)/1.05 var(--f-display);letter-spacing:.06em;color:#fff;margin:14px 0 16px;text-shadow:0 0 30px rgba(255,60,80,.5)}
.crash .dark{font-style:italic;color:#8b8fa6}
.crash .btn{margin-top:26px;opacity:0;animation:fadeUp .7s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
.headlights{position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 30% at 50% 50%,rgba(255,255,230,.0),transparent);animation:flash 2.6s ease-out 1.1s both}
@keyframes flash{0%{background:radial-gradient(50% 40% at 50% 55%,rgba(255,250,220,0),transparent)}12%{background:radial-gradient(80% 70% at 50% 55%,rgba(255,250,220,.55),transparent)}30%{background:radial-gradient(90% 80% at 50% 55%,rgba(255,250,220,0),transparent)}100%{background:none}}
.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:1px solid var(--line);background:linear-gradient(180deg,#132650,#0a1632);border-radius:3px;cursor:pointer;text-align:center}
.ccard:hover{border-color:var(--line-hi);box-shadow:0 0 16px rgba(98,208,255,.18)}
.ccard b{font:700 14px/1.2 var(--f-display);letter-spacing:.02em}
.ccard small{color:var(--gold);font-size:12.5px;line-height:1.25}
.ccard .ava{--rc:var(--cc)}
.ccard .ava .ic{color:var(--cc)}
.namein{display:flex;gap:8px;margin-top:12px}
.namein input{flex:1;min-width:0;height:46px;padding:0 12px;border:1px solid var(--line-hi);background:#060c1a;color:var(--ink);font:600 17px var(--f-display);border-radius:3px}
.gift{display:grid;place-items:center;margin:8px auto 4px;width:120px;height:120px;border:2px solid var(--gold);border-radius:6px;background:radial-gradient(circle,#3a2a0a,#0b0a10 70%);box-shadow:0 0 40px rgba(243,197,96,.45),inset 0 0 20px rgba(243,197,96,.2)}
.gift .ic{width:60%;height:60%;color:var(--r3);filter:drop-shadow(0 0 10px var(--r3))}
.giftname{text-align:center;font:700 22px/1.2 var(--f-display);color:#c9b0ff;margin:8px 0 2px}
.giftrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:rgba(8,15,32,.8);border-radius:3px;margin-top:8px}
.giftrow .ic{width:30px;height:30px;color:var(--gold)}
.giftrow b{display:block;font:700 14px/1.2 var(--f-display)}
.giftrow small{color:var(--ink-2);font-size:12.5px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,rgba(8,13,28,.94),rgba(3,5,11,.98));border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.navin{display:grid;grid-template-columns:repeat(5,1fr);padding-block:4px 6px}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:11.5px}
.nb .ic{width:24px;height:24px}
.nb.on{color:var(--ink)}
.nb.on .ic{color:var(--sys);filter:drop-shadow(0 0 8px var(--sys))}
.nb.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:2px;background:var(--sys);box-shadow:0 0 10px var(--sys)}
.nb .dot{top:4px;right:calc(50% - 18px)}
main{padding-block:6px calc(92px + env(safe-area-inset-bottom,0px))}

/* ---------- sheets & toasts ---------- */
.sheet-back{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(1,3,9,.72);animation:fadeIn .18s ease}
.sheet{position:relative;width:min(520px,100%);max-height:90vh;overflow-y:auto;padding:32px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#0f1f40,#08112a);border:1px solid var(--line-hi);border-bottom:0;box-shadow:0 -12px 50px rgba(47,134,198,.28);animation:slideUp .24s cubic-bezier(.2,.8,.2,1)}
.sheet .plate{position:sticky;top:-18px;left:auto;transform:none;display:flex;width:max-content;margin:-18px auto 14px}
.sheet .x{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:rgba(6,12,26,.8);cursor:pointer;padding:0;z-index:3}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.confirm{margin-top:12px;padding:12px;border:1px dashed var(--warn);background:rgba(60,40,8,.35);font-size:14px}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{max-width:480px;padding:10px 14px;border:1px solid var(--sys-dim);background:rgba(6,14,32,.96);box-shadow:0 0 18px rgba(98,208,255,.3);font-size:14px;text-align:center;animation:toastIn .25s ease, toastOut .4s ease 2.8s forwards}
.toast.gold{border-color:var(--gold-deep);box-shadow:0 0 18px rgba(243,197,96,.35)}
.toast.red{border-color:var(--crimson-deep);box-shadow:0 0 18px rgba(236,70,96,.35)}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0}}
@keyframes toastOut{to{transform:translateY(-8px);opacity:0}}

/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--void);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:10px 8px;font:600 11.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--sys)}
.bhead .loc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .turn{color:var(--ink);flex:none}
.stagebox{position:relative;border:1px solid var(--line-hi);border-radius:4px;overflow:hidden;background:#05070f;box-shadow:0 0 24px rgba(47,134,198,.22)}
.stagebox canvas{display:block;width:100%;height:clamp(230px,40vh,330px)}
.stagebox.shake{animation:shake .32s linear}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.hud{position:absolute;top:8px;width:46%;display:grid;gap:3px;pointer-events:none}
.hud.l{left:8px}.hud.r{right:8px;text-align:right}
.hud .nm{font:700 13px/1.15 var(--f-display);text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sub{font-size:11.5px;color:var(--ink-2);text-shadow:0 1px 3px #000}
.hud.r .sub.boss{color:var(--gold)}
.hud .bar{height:15px}
.hud .bar>span{font-size:10.5px;line-height:13px}
.pips{display:flex;gap:4px;align-items:center;margin-top:2px}
.pips .ic{width:13px;height:13px;color:var(--ink-2)}
.pips i{width:9px;height:9px;border-radius:50%;border:1px solid #7fa6d8;background:transparent}
.pips i.f{background:var(--sys);border-color:var(--sys);box-shadow:0 0 6px var(--sys)}
.sts{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.hud.r .sts{justify-content:flex-end}
.stc{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--c,#4a8adf);border-radius:3px;background:rgba(4,8,18,.85);color:var(--c,#7fbfff);box-shadow:0 0 8px color-mix(in srgb,var(--c,#4a8adf) 50%,transparent)}
.stc .ic{width:15px;height:15px}
.stc b{position:absolute;right:-4px;bottom:-5px;min-width:13px;height:13px;padding:0 2px;border-radius:7px;background:#0b1428;border:1px solid currentColor;font:700 9px/11px var(--f-mono);text-align:center}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font:800 22px/1 var(--f-display);color:#fff;text-shadow:0 0 8px rgba(0,0,0,.9),0 2px 0 #000;animation:floatUp 1.05s ease-out forwards;white-space:nowrap}
.fl.crit{font-size:30px;color:var(--gold);text-shadow:0 0 14px rgba(243,197,96,.8),0 2px 0 #000}
.fl.heal{color:var(--heal)}
.fl.miss{font-size:16px;color:#9fb0c8}
.fl.mana{color:#7fc0ff;font-size:17px}
.fl.dot{font-size:16px;color:#b6f07a}
.fl.hurt{color:#ff7088}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.intent{display:block;margin-top:10px;min-height:44px;padding:11px 12px;text-wrap:balance;border:1px solid var(--line);background:rgba(10,18,38,.88);font-size:14px;text-align:center;border-radius:3px}
.intent .ic{color:#b48cff;margin-right:6px}
.intent.warn{border-color:#c03850;background:linear-gradient(180deg,rgba(110,20,36,.9),rgba(70,12,24,.9));color:#ffe0e5;font-weight:600;box-shadow:0 0 18px rgba(236,70,96,.35)}
.intent.warn .ic{color:var(--warn)}
.blog{min-height:96px;margin-top:8px;padding:8px 10px;border-left:2px solid var(--line-hi);background:linear-gradient(90deg,rgba(14,26,52,.7),transparent);font-size:13px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.blog div{color:var(--ink-2)}
.blog div:last-child{color:var(--ink)}
.blog b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.blog .g{color:var(--heal)} .blog .r{color:#ff8396} .blog .y{color:var(--gold)} .blog .c{color:#7fd6ff} .blog .p{color:#c9a8ff}
.acts{display:grid;gap:8px;margin-top:10px;padding-bottom:14px}
.acts .r1{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.acts .r2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ab>span:not(.mp):not(.cnt):not(.mom):not(.cdv){max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.ab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:76px;padding:8px 4px;border:1px solid #2c4f86;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,#14284f,#0b1834);font:600 12.5px/1.15 var(--f-body);text-align:center;transition:filter .12s,box-shadow .12s}
.ab .ic{width:26px;height:26px;color:#8fc8ff;filter:drop-shadow(0 0 6px rgba(98,208,255,.6))}
.ab.atk{border-color:#a83a52;box-shadow:inset 0 -2px 0 #e2475f}
.ab.atk .ic{color:#ff9aac;filter:drop-shadow(0 0 6px rgba(236,70,96,.7))}
.ab.skl{border-color:#5b4bb0;box-shadow:inset 0 -2px 0 #8a6cff}
.ab.skl .ic{color:#c4b0ff;filter:drop-shadow(0 0 6px rgba(154,124,255,.7))}
.ab.small{min-height:62px;font-size:12px}
.ab .mp{position:absolute;top:4px;right:5px;font:700 10.5px/1 var(--f-mono);color:#7fc0ff}
.ab .cnt{position:absolute;top:4px;right:6px;font:700 11px/1 var(--f-mono);color:var(--gold)}
.ab .mom{position:absolute;top:4px;left:5px;font:700 10.5px/1 var(--f-mono);color:var(--ink-2)}
.ab .cdv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 30px/1 var(--f-display);color:#9fd6ff;background:rgba(3,6,14,.88);border-radius:3px}
.ab[disabled]{cursor:not-allowed}
.ab[disabled]:not(.cdon){opacity:.4}
.ab.hl{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(243,197,96,.4)}
.ab.on{border-color:var(--gold);background:linear-gradient(180deg,#4a3a12,#2a200a)}
.ab.on .ic{color:var(--gold)}
.ab:not([disabled]):hover{filter:brightness(1.18)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;padding-bottom:16px}
.bfoot .lootline{font:600 12.5px/1.2 var(--f-mono);color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.bfoot .lootline span{display:inline-flex;gap:3px;align-items:center}
.result{margin-top:10px}
.result h3{font:800 28px/1.1 var(--f-display);letter-spacing:.06em;text-align:center;margin:4px 0 12px;color:var(--gold);text-shadow:0 0 22px rgba(243,197,96,.55)}
.result h3.lose{color:#ff6b80;text-shadow:0 0 22px rgba(236,70,96,.55)}
.loot{display:grid;gap:6px}
.loot .li{display:flex;align-items:center;gap:8px;font-size:14.5px}
.loot .li b{font-family:var(--f-mono)}
.loot .itemrow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--rcol);background:rgba(8,15,32,.8);border-radius:3px}
.loot .itemrow .cell{width:42px;flex:none}
.loot .itemrow b{display:block;font:600 14px/1.2 var(--f-display);color:var(--rcol)}
.loot .itemrow small{color:var(--ink-2);font-size:12px}
.lvup{margin-top:10px;font:700 16px/1.2 var(--f-display);letter-spacing:.06em;color:var(--gold);text-align:center}
.how details{border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;margin-top:8px}
.how summary{cursor:pointer;padding:13px 14px;font:700 14.5px/1.2 var(--f-display);letter-spacing:.04em;list-style:none;display:flex;justify-content:space-between;gap:10px}
.how summary::-webkit-details-marker{display:none}
.how details[open] summary{border-bottom:1px solid var(--line)}
.how .body{padding:12px 14px;font-size:14px;color:var(--ink-2)}
.how .body p{margin:0 0 8px}
.how .body b{color:var(--ink)}
.mail{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;margin-top:8px}
.mail.unread{border-color:var(--sys-dim);box-shadow:inset 3px 0 0 var(--sys)}
.mail .t{flex:1;min-width:0}
.mail .t b{display:block;font:700 14.5px/1.2 var(--f-display)}
.mail .t p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.mail .t small{color:var(--ink-3);font-size:12px}
.shoprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px;border:1px solid var(--line);background:rgba(8,15,32,.85);border-radius:3px;margin-top:8px}
.shoprow .ic.big{width:34px;height:34px}
.shoprow .t{flex:1 1 140px;min-width:0}
.shoprow .ctl{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn.exch{flex-direction:column;gap:3px;min-width:0;padding-inline:6px}
.grid3>*,.grid2>*{min-width:0}
.shoprow .t b{display:block;font:700 14.5px/1.2 var(--f-display)}
.shoprow .t small{color:var(--ink-2);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border:1px solid var(--line-hi);background:#0b1833;border-radius:3px;cursor:pointer;padding:0}
.stepper b{min-width:26px;text-align:center;font-family:var(--f-mono)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 0;border-bottom:1px dashed rgba(59,124,201,.18)}
.tbl td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.foot{margin:22px 0 4px;text-align:center;font-size:12px;color:var(--ink-3)}
@media (max-width:430px){ .chip i{display:none} .cur{gap:4px} }
@media (max-width:380px){
  .chip{padding:4px 6px;font-size:12px}
  .classes{grid-template-columns:1fr 1fr}
  .mtiles{grid-template-columns:repeat(2,1fr)}
  .ab{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .stagebox.shake{animation:none}
}

/* ===================== UTIL ===================== */
const R = Math.random;
const rint = (a, b) => a + Math.floor(R() * (b - a + 1));
const rr = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr, rnd) => arr[Math.floor((rnd || R)() * arr.length)];
function wpick(pairs, rnd){ rnd = rnd || R; let t = 0; for (const p of pairs) t += p[1]; let x = rnd() * t; for (const p of pairs){ x -= p[1]; if (x <= 0) return p[0]; } return pairs[pairs.length - 1][0]; }
function widx(w, rnd){ rnd = rnd || R; let t = 0; for (const x of w) t += x; let x = rnd() * t; for (let i = 0; i < w.length; i++){ x -= w[i]; if (x <= 0) return i; } return w.length - 1; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){ n = Math.round(n || 0); const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n < 0 ? '−' : '') + s; }
function pct(v, d){ d = d == null ? 1 : d; return (v * 100).toFixed(d).replace('.', ',') + '%'; }
function dec(v, d){ return v.toFixed(d == null ? 2 : d).replace('.', ','); }
function plural(n, one, few, many){ n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return many; if (n1 > 1 && n1 < 5) return few; if (n1 === 1) return one; return many; }
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function dayKey(ts){ const d = new Date(ts || Date.now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayDiff(a, b){ if (!a || !b) return 99; const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5); }

function gearSum(equip){

function basicFx(cls){ return {swordsman:'slash', mage:'fire', slime:'acid', spider:'needle', goblin:'slash', assassin:'xslash', shield:'ring', priestess:'holy'}[cls] || 'slash'; }

function mkIntent(f, id){ const ab = AB[id]; return Object.assign({}, ab, {ab:id, name:(f.names && f.names[id]) || ab.name}); }
function chooseIntent(b){
  const f = b.foe, h = b.hero;

    if (id === 'regen' && f.hp > f.maxHp * .7) return false;
    if (id === 'shell' && f.st.shell) return false;

function actName(a){ if (a.t === 'skill') return SK[a.id].name; return {attack:'атаку', guard:'захист', hp:'зілля здоров’я', mp:'зілля мани'}[a.t] || 'атаку'; }
function aiChoose(b, me, foe){
  const hpP = me.hp / me.maxHp;

function playTurn(b, act){

function endOfTurn(b){

    if (a.hp > 0 && a.st.bleed) dot(b, a, a.st.bleed.v, 'кровотеча');
    if (a.hp > 0 && a.cls === 'priestess') heal(b, a, a.maxHp * .012, 'Шість пелюсток', 1);
  }
  for (const a of [b.hero, b.foe]){
    if (a.cls === 'swordsman' && a.dealt) a.res.mom = Math.min(5, (a.res.mom || 0) + 1);
    a.dealt = false; a.acted = false; a.taken = [a.taken[1], 0];

}
function onFoeDown(b){

  const RO = ROLE[f.role], L = f.lvl, hl = S.hero.lvl, gob = S.hero.cls === 'goblin';
  let xp = (12 + 3 * L) * RO.xp; const gap = hl - L;

  let sh = 0; if (RO.sh){ sh = rint(RO.sh[0], RO.sh[1]); b.loot.shards += sh; }
  const c = calc(S.hero, S.equip);

  let n = R() < dc ? 1 : 0;
  if ((f.role === 'boss' || f.role === 'tboss') && R() < .4) n++;
  if (f.role === 'tboss') n++;
  const items = [];
  for (let i = 0; i < n; i++){
    let r = rollRarity(f.role, luck);

    if (i === 0 && f.role === 'boss') r = Math.max(r, 2);
    const slot = R() < .16 ? 'weapon' : pick(SLOTS.slice(1));

  }
  b.loot.items = b.loot.items.concat(items);
  if (S.quest){ S.quest.k++; if (f.role !== 'normal') S.quest.b++; }
  S.stats.kills++; if (f.role === 'boss' || f.role === 'tboss') S.stats.bosses++;
  log(b, '<span class="y">Здобич: +' + xp + ' досвіду, +' + gold + ' золота' + (sh ? ', +' + sh + ' осколк' + plural(sh, 'ок', 'и', 'ів') + ' мани' : '') + '</span>');
  items.forEach(it => log(b, 'Випало: <span style="color:' + RAR[it.r].hex + '">' + esc(it.name) + '</span> (' + RAR[it.r].name.toLowerCase() + ')'));
}

/* ===================== STATE ===================== */
const SAVE_KEY = 'myslyvets-bram-v1';
const ENERGY_MAX = 75, ENERGY_MS = 5 * 60 * 1000;
const QUEST = {k:40, b:8, s:60};
let S = null;

function freshQuest(streak, best){ return {k:0, b:0, s:0, push:false, claimed:false, streak:streak || 0, best:best || 0}; }
function freshState(){
  const now = Date.now();
  return {v:1, created:now, savedAt:now, hero:null, energy:ENERGY_MAX, energyTs:now, gold:0, crystals:0, shards:0, soul:0, potHp:3, potMp:3,
    bag:[], bagCap:60, equip:{}, loadout:[], day:dayKey(), lastQuestDay:null, quest:freshQuest(0, 0),
    arena:{rating:1000, fights:5, wins:0, losses:0, best:1000, rivals:[], opp:[]},
    wheel:{free:true, spins:0}, shop:{energy:0}, mail:[], gates:{clear:{}, endlessBest:0}, run:null,
    settings:{fx:true, fast:false, autoSell:false}, stats:{kills:0, bosses:0, deaths:0, gates:0, arenaWins:0, goldEarned:0}, resets:0};
}
function migrate(s){
  const f = freshState();
  for (const k in f) if (!(k in s)) s[k] = f[k];
  for (const k of ['quest','arena','wheel','shop','gates','settings','stats']) s[k] = Object.assign({}, f[k], s[k] || {});
  if (!Array.isArray(s.bag)) s.bag = [];
  if (!Array.isArray(s.mail)) s.mail = [];
  if (!s.equip) s.equip = {};
  if (!Array.isArray(s.loadout)) s.loadout = [];
  return s;
}
function saveLocal(){ S.savedAt = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function save(){ saveLocal(); Cloud.queue(); }
function loadLocal(){ try { const raw = localStorage.getItem(SAVE_KEY); if (raw){ const s = JSON.parse(raw); if (s && typeof s === 'object') return migrate(s); } } catch (e) {} return null; }

/* ---------- time systems ---------- */
function regenEnergy(){
  const now = Date.now();
  if (S.energy >= ENERGY_MAX){ S.energyTs = now; return; }
  const n = Math.floor((now - S.energyTs) / ENERGY_MS);
  if (n > 0){ S.energy = Math.min(ENERGY_MAX, S.energy + n); S.energyTs += n * ENERGY_MS; if (S.energy >= ENERGY_MAX) S.energyTs = now; }
}
function energyEta(){
  if (S.energy >= ENERGY_MAX) return null;
  const next = ENERGY_MS - (Date.now() - S.energyTs);
  const full = next + (ENERGY_MAX - S.energy - 1) * ENERGY_MS;
  return {next:Math.max(0, next), full:Math.max(0, full)};
}
function fmtDur(ms){
  const m = Math.ceil(ms / 60000);
  if (m < 60) return m + ' хв';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + ' год' + (mm ? ' ' + mm + ' хв' : '');
}
function checkDay(){
  const k = dayKey();
  if (S.day === k) return false;
  const gap = dayDiff(S.day, k);
  const streak = (S.quest.claimed && gap === 1) ? S.quest.streak : 0;
  S.quest = freshQuest(streak, S.quest.best);
  S.arena.fights = 5; S.shop.energy = 0; S.wheel.free = true;
  if (S.arena.rivals) S.arena.rivals.forEach(r => { r.rating = Math.max(600, r.rating + rint(-25, 35) * Math.min(3, gap)); });
  S.day = k;
  save();
  return true;

/* ---------- hero helpers ---------- */
function rankForLevel(L){ let r = 'E'; for (const x of RANKS) if (L >= x.lvl) r = x.id; return r; }
function slotsFor(rank){ return RANKS[rankIdx(rank)].slots; }
function unlockedSkills(){
  const h = S.hero, ri = rankIdx(h.rank), c = calc(h, S.equip);
  const cls = CLS[h.cls].skills.filter(id => ri >= SK[id].rank);
  const gen = GEN_SKILLS.filter(id => (c.s[SK[id].gen] || 0) >= 30);
  return cls.concat(gen);
}
function activeLoadout(){
  if (!S.hero) return [];
  const un = unlockedSkills();
  const lo = S.loadout.filter(id => un.indexOf(id) >= 0).slice(0, slotsFor(S.hero.rank));
  return lo;
}
function fillLoadout(){
  const un = unlockedSkills(), max = slotsFor(S.hero.rank);
  S.loadout = S.loadout.filter(id => un.indexOf(id) >= 0);
  for (const id of un){ if (S.loadout.length >= max) break; if (S.loadout.indexOf(id) < 0 && SK[id].cls) S.loadout.push(id); }
}
function addXp(n){
  const h = S.hero, ups = [];
  h.xp += n;
  while (h.xp >= xpNeed(h.lvl) && h.lvl < 60){ h.xp -= xpNeed(h.lvl); h.lvl++; h.pts += 5; ups.push(h.lvl); }
  if (h.lvl >= 60) h.xp = Math.min(h.xp, xpNeed(60));
  return ups;
}
function autoStats(cls, L, rnd){ const C = CLS[cls]; const st = Object.assign({}, C.base); let pts = (L - 1) * 5; const pr = Object.keys(C.prio).map(k => [k, C.prio[k]]); while (pts > 0){ st[wpick(pr, rnd)]++; pts--; } return st; }
function autoAllocate(){
  const h = S.hero; if (!h.pts) return;
  const pr = Object.keys(CLS[h.cls].prio).map(k => [k, CLS[h.cls].prio[k]]);
  const rnd = mulberry32(h.lvl * 31 + h.pts);
  while (h.pts > 0){ h.stats[wpick(pr, rnd)]++; h.pts--; }
}

/* ---------- arena rivals ---------- */
function genHunter(seed, name, cls, L, rating){
  const rnd = mulberry32(seed);
  cls = cls || CLASS_IDS[Math.floor(rnd() * CLASS_IDS.length)];
  L = clamp(L, 1, 60);
  const stats = autoStats(cls, L, rnd), rank = rankForLevel(L);
  const rq = rating >= 1400 ? 3 : rating >= 1200 ? 2 : rating >= 1050 ? 1 : 0;
  const fill = clamp(.25 + L * .045, .25, 1);
  const equip = {};
  for (const s of SLOTS){ if (s !== 'weapon' && rnd() > fill) continue; equip[s] = makeItem(s, Math.max(1, L - Math.floor(rnd() * 3)), clamp(rq + (s === 'weapon' ? 1 : 0) + (rnd() < .2 ? 1 : 0) - (rnd() < .3 ? 1 : 0), 0, 4), cls, rnd); }
  const c = calc({cls, lvl:L, stats, rank}, equip);
  const skills = CLS[cls].skills.filter(id => rankIdx(rank) >= SK[id].rank).slice(0, slotsFor(rank));
  return {name, cls, lvl:L, rank, rating, c, skills};
}
function genRivals(){
  const names = RIVAL_NAMES.slice().sort(() => R() - .5).slice(0, 14);
  return names.map((n, i) => ({id:'r' + i + '_' + uid(), name:n, cls:CLASS_IDS[i % CLASS_IDS.length], off:rint(-2, 1), rating:rint(900, 1180), seed:rint(1, 1e9)}));
}
function rivalHunter(r){ return Object.assign(genHunter(r.seed, r.name, r.cls, (S.hero ? S.hero.lvl : 1) + r.off, r.rating), {id:r.id}); }
function sanitizeProfile(id, d){
  if (!d || typeof d.n !== 'string' || !CLS[d.c]) return null;
  const l = clamp(Math.round(+d.l || 1), 1, 60);
  const base = calc({cls:d.c, lvl:l, stats:autoStats(d.c, l, mulberry32(l)), rank:rankForLevel(l)}, null);
  const cs = d.cs || {};
  const lim = (k, hi) => clamp(+cs[k] || base[k], base[k] * .5, base[k] * hi);
  return {id, live:1, name:String(d.n).slice(0, 18), cls:d.c, lvl:l, rank:RANKS.some(r => r.id === d.r) ? d.r : rankForLevel(l), rating:clamp(Math.round(+d.rt || 1000), 0, 5000),
    c:{atk:Math.round(lim('atk', 3)), def:Math.round(lim('def', 3)), hp:Math.round(lim('hp', 3)), mp:Math.round(lim('mp', 2.5)), crit:clamp(+cs.crit || .05, 0, .75), critDmg:clamp(+cs.critDmg || 1.5, 1.5, 4), acc:clamp(+cs.acc || .85, .5, .99), eva:clamp(+cs.eva || .05, 0, .45), spd:clamp(+cs.spd || .5, .2, .9), pen:clamp(+cs.pen || 0, 0, .5), sp:clamp(+cs.sp || 1, 1, 2.5)},
    skills:Array.isArray(d.sk) ? d.sk.filter(s => typeof s === 'string' && SK[s] && (SK[s].cls === d.c || SK[s].gen)).slice(0, 5) : []};
}
function arenaPool(){
  const pool = (S.arena.rivals || []).map(rivalHunter);
  for (const p of Cloud.roster) pool.push(p);
  return pool;
}
function pickOpponents(){
  const me = S.arena.rating;
  const pool = arenaPool().sort((a, b) => Math.abs(a.rating - me) - Math.abs(b.rating - me));
  const near = pool.slice(0, 8).sort(() => R() - .5).slice(0, 3);
  S.arena.opp = near.map(o => o.id);
}

/* ---------- cloud sync (claude.ai artifact db) ---------- */
const Cloud = {
  mode:null, label:'прогрес синхронізується з твоїм акаунтом Claude',
  db:null, uid:null, ready:false, writing:false, pending:false, lastJson:'', lastProf:'', roster:[], t:0,
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = res[0], user = res[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id; this.mode = 'claude';
      const snap = await db.doc('data/users/' + id + '/save').get();
      if (snap && snap.exists){
        const d = snap.data();
        if (d && typeof d.json === 'string'){
          let remote = null; try { remote = migrate(JSON.parse(d.json)); } catch (e) {}
          if (remote && remote.hero && (!S.hero || (remote.savedAt || 0) > (S.savedAt || 0))){
            S = remote; this.lastJson = d.json; saveLocal(); onCloudAdopt();
          }
        }
      }
      this.ready = true;
      await this.loadRoster();
      if (S.hero) this.queue(1500);
      onCloudReady();
    } catch (e) { this.ready = false; }
  },
  queue(ms){ if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.flush(), ms || 6000); },
  async flush(){
    if (!this.ready || !S || !S.hero) return;
    if (this.writing){ this.pending = true; return; }
    const json = JSON.stringify(S);
    if (json.length > 240000) return;
    this.writing = true;
    try {
      if (json !== this.lastJson){ await this.db.doc('data/users/' + this.uid + '/save').set({json, at:S.savedAt}); this.lastJson = json; }
      await this.pushProfile();
    } catch (e) { if (e && e.code === 'invalid_argument') this.ready = false; }
    this.writing = false;
    if (this.pending){ this.pending = false; this.queue(); }
  },
  async pushProfile(){
    const c = calc(S.hero, S.equip);
    const prof = {n:S.hero.name.slice(0, 18), c:S.hero.cls, l:S.hero.lvl, r:S.hero.rank, rt:S.arena.rating,
      cs:{atk:c.atk, def:c.def, hp:c.hp, mp:c.mp, crit:+c.crit.toFixed(3), critDmg:+c.critDmg.toFixed(3), acc:+c.acc.toFixed(3), eva:+c.eva.toFixed(3), spd:+c.spd.toFixed(3), pen:+c.pen.toFixed(3), sp:+c.sp.toFixed(3)},
      sk:activeLoadout()};
    const key = JSON.stringify(prof);
    if (key === this.lastProf) return;
    try { await this.db.doc('arena/' + this.uid).set(Object.assign({at:Date.now()}, prof)); this.lastProf = key; } catch (e) {}
  },
  async loadRoster(){
    if (!this.db) return;
    try {
      const q = await this.db.collection('arena').orderBy('rt', 'desc').limit(100).get();
      this.roster = q.docs.filter(d => d.exists && d.id !== this.uid).map(d => sanitizeProfile('live_' + d.id, d.data())).filter(Boolean);
    } catch (e) {}
  },
};

function hexToRgb(h){ h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a){ const c = hexToRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(h1, h2, t){ const a = hexToRgb(h1), b = hexToRgb(h2); return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')'; }

function kit(g){
  return {
    g,
    e(x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); g.fill(); },
    c(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); },
    p(){ const a = arguments; g.beginPath(); g.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) g.lineTo(a[i], a[i + 1]); g.closePath(); g.fill(); },
    l(x1, y1, x2, y2, w){ g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); },
    pl(w){ const a = arguments; g.lineWidth = w; g.beginPath(); g.moveTo(a[1], a[2]); for (let i = 3; i < a.length; i += 2) g.lineTo(a[i], a[i + 1]); g.stroke(); },
    q(x1, y1, cx, cy, x2, y2, w){ g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(cx, cy, x2, y2); g.stroke(); },
    path(d){ g.fill(new Path2D(d)); },
    sc(col){ g.fillStyle = col; g.strokeStyle = col; },
  };
}
function mirrorPath(d){ return d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g, (m, x, y) => (-parseFloat(x)) + ' ' + y); }

  const m = map[v]; if (!m) return tabView(UI.tab);
  return '<div class="subhead"><button class="back" data-a="back">' + ic('back') + 'Назад</button><h2>' + m[0] + '</h2></div>' + m[1]();
}
function win(title, body, kind, cls){ return '<section class="win' + (cls ? ' ' + cls : '') + '">' + iiPlate(title, kind) + body + '</section>'; }
function bar(cls, v, max, label){ const p = max > 0 ? clamp(v / max * 100, 0, 100) : 0; return '<div class="bar ' + cls + '" style="--p:' + p.toFixed(1) + '%"><i></i><span>' + (label != null ? label : fmt(v) + ' / ' + fmt(max)) + '</span></div>'; }

/* ---------- hunter ---------- */
function statInfo(k, c){
  const C = CLS[S.hero.cls], main = C.main === k, val = c.s[k];
  const genId = GEN_SKILLS.find(id => SK[id].gen === k);
  const gen = genId ? ' На 30 відкривається загальна навичка «' + SK[genId].name + '» (зараз ' + val + '/30).' : '';
  const T = {
    str:'Сила: ' + (main ? 'головна характеристика твого класу — +' + dec(C.atkCoef, 1) + ' атаки за очко' : '+1 атаки за очко') + ' і +0,3% пробиття броні. Зараз пробиття ' + pct(c.pen) + '.',
    agi:'Спритність: шанс криту (+1,2% за очко), ухилення (+0,6%) і швидкість — шанс ударити першим (+0,6%).' + (main ? ' Для твого класу ще й атака: +' + dec(C.atkCoef, 1) + ' за очко.' : ''),
    vit:'Витривалість: здоров’я (+22 за очко) і захист (+5 за очко). Захист ріже вхідну шкоду, але не більше ніж на 75%.' + (main ? ' Для твого класу ще й атака: +' + dec(C.atkCoef, 1) + ' за очко.' : ''),
    int:'Інтелект: мана (+20 за очко) і сила навичок (+0,4%). Магічні удари ігнорують третину ворожого захисту.' + (main ? ' Для твого класу ще й атака: +' + dec(C.atkCoef, 1) + ' за очко.' : ''),
    per:'Чуття: влучність (+0,6% за очко), сила криту (+0,02×) і удача на рідкісні речі.' + (main ? ' Для твого класу ще й атака: +' + dec(C.atkCoef, 1) + ' за очко.' : ''),
  };
  return T[k] + gen;
}

    '<div class="barlab"><span>Здоров’я</span><span class="num">' + fmt(c.hp) + '</span></div>' + bar('hp', c.hp, c.hp) +

  const st = STAT_IDS.map(k => '<div class="st' + (UI.statSel === k ? ' on' : '') + '" data-a="statSel" data-k="' + k + '" role="button" tabindex="0"><span>' + STATS_SHORT[k] + (CLS[h.cls].main === k ? ' ★' : '') + '</span><b>' + c.s[k] + '</b>' + (h.pts > 0 ? '<button class="plus" data-a="addStat" data-k="' + k + '" aria-label="Додати очко до ' + STATN[k] + '">' + ic('plus') + '</button>' : '') + '</div>').join('');

  const mailN = unreadMail();

    '<button class="tile red" data-a="tab" data-v="gates">' + ic('n_gates') + 'До брам</button>' +
    '<button class="tile goldt" data-a="go" data-v="shop">' + ic('shop') + 'Магазин</button>' +
    '<button class="tile" data-a="go" data-v="quest">' + ic('quest') + 'Квест дня' + (questReady() ? '<i class="dot"></i>' : '') + '</button>' +
    '<button class="tile" data-a="go" data-v="skills">' + ic('skills') + 'Навички</button>' +
    '<button class="tile" data-a="go" data-v="mail">' + ic('mail') + 'Пошта' + (mailN ? '<span class="badge">' + mailN + '</span>' : '') + '</button>' +

  return html;
}

/* ---------- gates ---------- */
function gateCost(g){ return g.trial ? 6 : 4; }
function gateMobsText(g){
  if (g.endless) return 'Усі монстри світу, сильнішають щоповерху';
  const ids = g.trial ? g.elites.concat([g.boss]) : g.mobs.concat(g.guards);
  return ids.map(id => MON[id].name).join(' · ');
}
function vGates(){
  const h = S.hero, eta = energyEta(), ri = rankIdx(h.rank);
  let html = win('Брами',
    bar('en', S.energy, ENERGY_MAX, 'Енергія ' + S.energy + ' / ' + ENERGY_MAX) +
    '<div class="enrow"><span data-tick="eta">' + (eta ? '+1 через ' + fmtDur(eta.next) + ' · повна через ' + fmtDur(eta.full) : 'Енергія повна') + '</span><span>вхід ⚡4 · глибше ⚡2</span></div>' +
    '<p class="lead" style="margin-top:10px">Вхід на поверх повертає повне здоров’я й ману. Усередині поверху здоров’я не відновлюється, між боями повертається 30% мани. Зілля — тільки твої власні.</p>' +
    '<div class="mode"><button class="farmcard" data-a="startFarm"><b>' + ic('st_shadow') + 'Фарм-зона</b><small>без енергії, монстри твого рівня</small></button>' +
    '<button class="farmcard" data-a="go" data-v="quest"><b>' + ic('quest') + 'Квест дня</b><small>' + Math.min(S.quest.k, QUEST.k) + '/' + QUEST.k + ' монстрів · ' + Math.min(S.quest.b, QUEST.b) + '/' + QUEST.b + ' босів</small></button></div>');
  RANKS.forEach((rk, i) => {
    const gates = GATES.filter(g => g.rank === i);
    const locked = i > ri;
    const open = UI.open[rk.id] != null ? UI.open[rk.id] : (i === ri);
    html += '<button class="rankhead' + (locked ? ' lock' : '') + '" data-a="toggleRank" data-v="' + rk.id + '" aria-expanded="' + (open ? 'true' : 'false') + '"><span class="medal rank-' + rk.id + '">' + rk.id + '</span><span class="t"><b>Ранг ' + rk.id + '</b><small>' + gates.length + ' ' + plural(gates.length, 'брама', 'брами', 'брам') + ' · ур. ' + rk.lvl + '+' + (locked ? ' · потрібен ранг ' + rk.id : '') + '</small></span>' + (locked ? ic('lock') : ic('chev', 'chev')) + '</button>';
    if (!open) return;
    gates.forEach(g => {
      const cleared = S.gates.clear[g.id] || 0;
      const lvlOk = h.lvl >= g.lvl, rankOk = ri >= g.rank, cost = gateCost(g), enOk = S.energy >= cost;
      let btn;
      if (!rankOk) btn = '<span class="lockbtn">' + ic('lock') + 'ранг ' + RANKS[g.rank].id + '</span>';
      else if (!lvlOk) btn = '<span class="lockbtn">' + ic('lock') + 'ур. ' + g.lvl + '</span>';
      else btn = '<button class="btn ' + (g.trial ? 'gold' : 'blue') + ' sm" data-a="enterGate" data-v="' + g.id + '"' + (enOk ? '' : ' disabled') + '>Увійти <span class="cost">' + ic('energy') + cost + '</span></button>';
      const passed = g.trial && rankIdx(h.rank) > g.rank;
      html += '<div class="gate' + (g.trial ? ' trial' : '') + (!rankOk || !lvlOk ? ' lock' : '') + '" style="--gbg:radial-gradient(60% 120% at 90% 50%,' + rgba(BGS[g.bg].glow, .35) + ',transparent)">' +
        '<span class="medal rank-' + RANKS[g.rank].id + '">' + (g.trial ? g.trial : RANKS[g.rank].id) + '</span>' +
        '<div class="t"><b>' + g.name + '</b><small>' + (g.endless ? 'ур. ' + g.lvl + '+ · без кінця' + (S.gates.endlessBest ? ' · рекорд: поверх ' + S.gates.endlessBest : '') : 'ур. ' + g.lvl + '+ · ' + (g.trial ? '1 поверх' : '3 поверхи')) + '</small><div class="mobs">' + gateMobsText(g) + '</div>' +
        (passed ? '<span class="done">✓ РАНГ ' + g.trial + ' ОТРИМАНО</span>' : cleared ? '<span class="done">✓ пройдено ×' + cleared + '</span>' : '') + '</div>' + btn + '</div>';
    });
  });
  return html;
}

/* ---------- arena ---------- */
function findOpp(id){ return arenaPool().find(o => o.id === id); }
function vArena(){
  const A = S.arena;
  if (!A.opp || !A.opp.length || A.opp.some(id => !findOpp(id))) pickOpponents();
  let html = win('Арена',
    '<div class="bigstats"><div><small>Рейтинг</small><b>' + fmt(A.rating) + '</b></div><div><small>Боїв на сьогодні</small><b>' + A.fights + '/5</b></div></div>' +
    '<p class="lead" style="margin-top:10px">Суперником керує Система — за його навичками й речами. Перемога дає рейтинг, золото й кристал. На арену береш лише 2 зілля здоров’я і 1 зілля мани.</p>' +
    '<p class="lead" style="margin-top:6px">Перемог: ' + A.wins + ' · поразок: ' + A.losses + ' · найкращий рейтинг: ' + fmt(A.best) + '</p>');
  html += '<div class="toggle2"><button class="seg' + (UI.arenaTab === 'opp' ? ' on' : '') + '" data-a="arenaTab" data-v="opp">Суперники</button><button class="seg' + (UI.arenaTab === 'top' ? ' on' : '') + '" data-a="arenaTab" data-v="top">' + ic('trophy') + ' Топ-10</button></div>';
  if (UI.arenaTab === 'opp'){
    A.opp.map(findOpp).filter(Boolean).forEach(o => {
      html += '<div class="opp"><span class="ava rank-' + o.rank + '" style="--rc:' + CLS[o.cls].color + '">' + ic('c_' + o.cls) + '</span><div class="t"><b>' + esc(o.name) + (o.live ? '<span class="tag-live">ГРАВЕЦЬ</span>' : '') + '</b><small>' + CLS[o.cls].name + ' · ур. ' + o.lvl + ' · ★ ' + fmt(o.rating) + ' · міць ' + fmt(powerOf(o.c)) + '</small></div>' +
        '<button class="btn red sm" data-a="arenaFight" data-v="' + esc(o.id) + '"' + (A.fights > 0 ? '' : ' disabled') + '>У бій</button></div>';
    });
    html += '<div class="row" style="margin-top:10px"><button class="btn ghost sm wide" data-a="arenaRefresh">' + ic('refresh') + 'Інші суперники</button></div>';
    if (A.fights <= 0) html += '<p class="hint">Бої на сьогодні закінчились. Нові — завтра.</p>';
  } else {
    const me = {id:'me', name:S.hero.name, cls:S.hero.cls, lvl:S.hero.lvl, rank:S.hero.rank, rating:A.rating, me:1};
    const list = arenaPool().concat([me]).sort((a, b) => b.rating - a.rating);
    const pos = list.findIndex(x => x.me) + 1;
    list.slice(0, 10).forEach((o, i) => {
      html += '<div class="opp' + (o.me ? ' me' : '') + '"><span class="pos">' + (i + 1) + '</span><span class="ava rank-' + o.rank + '">' + ic('c_' + o.cls) + '</span><div class="t"><b>' + esc(o.name) + (o.live ? '<span class="tag-live">ГРАВЕЦЬ</span>' : '') + (o.me ? ' (ти)' : '') + '</b><small>' + CLS[o.cls].name + ' · ур. ' + o.lvl + '</small></div><b class="num">' + fmt(o.rating) + '</b></div>';
    });
    if (pos > 10) html += '<p class="hint">Твоє місце: ' + pos + ' з ' + list.length + '.</p>';
  }
  return html;
}

/* ---------- bag ---------- */
function slotCell(slot){
  const it = S.equip[slot];
  const nm = slot === 'weapon' ? CLS[S.hero.cls].weapon.slot : SLOT[slot].name;
  if (!it) return '<button class="slot" data-a="slotInfo" data-v="' + slot + '">' + ic(slot === 'weapon' ? CLS[S.hero.cls].weapon.icon : SLOT[slot].icon) + '<small>' + nm + '</small></button>';
  return '<button class="slot has" style="--rcol:' + rcol(it.r) + '" data-a="itemEq" data-v="' + slot + '">' + ic(itemIcon(it)) + '<small>' + nm + '</small><span class="lv">ур.' + it.lvl + '</span>' + (it.up ? '<span class="up">+' + it.up + '</span>' : '') + '</button>';
}
function cellHtml(it, act){
  const eq = S.equip[it.slot], better = itemPower(it) > itemPower(eq);
  return '<button class="cell" style="--rcol:' + rcol(it.r) + '" data-a="' + (act || 'itemBag') + '" data-v="' + it.id + '" aria-label="' + esc(it.name) + '">' + ic(itemIcon(it)) + '<span class="lv">' + it.lvl + '</span>' + (it.up ? '<span class="up">+' + it.up + '</span>' : '') + (it.nw ? '<span class="new">НОВЕ</span>' : '') + (better ? '<span class="better">▲</span>' : '') + '</button>';
}
function vBag(){
  const h = S.hero, c = calc(h, S.equip);
  let html = win('Спорядження',
    '<div class="doll"><div class="col">' + ['helm','chest','legs','boots','gloves'].map(slotCell).join('') + '</div>' +

    '<div class="inv" style="grid-template-columns:1fr;gap:6px;margin-top:6px"><div class="it">' + ic('coin') + fmt(S.gold) + '</div><div class="it">' + ic('shard') + S.shards + '</div></div></div>' +
    '<div class="col">' + ['weapon','neck','ear','ring'].map(slotCell).join('') + '</div></div>');
  const counts = [0, 0, 0, 0, 0, 0]; S.bag.forEach(i => counts[i.r]++);
  const list = S.bag.filter(i => UI.rarF < 0 || i.r === UI.rarF).sort((a, b) => b.r - a.r || b.lvl - a.lvl || itemPower(b) - itemPower(a));
  let filt = '<div class="filters"><button class="fchip' + (UI.rarF < 0 ? ' on' : '') + '" data-a="rarF" data-v="-1">Усі · ' + S.bag.length + '</button>';
  RAR.forEach((r, i) => { if (counts[i]) filt += '<button class="fchip' + (UI.rarF === i ? ' on' : '') + '" data-a="rarF" data-v="' + i + '" style="--c:' + r.c + '"><i></i>' + counts[i] + '</button>'; });
  filt += '</div>';
  let bulk = '';

    const gold = list.reduce((s, i) => s + sellPrice(i), 0), sh = list.reduce((s, i) => s + shardYield(i), 0);

  }
  html += win('Сумка ' + S.bag.length + '/' + S.bagCap,
    filt + (list.length ? '<div class="bag">' + list.map(i => cellHtml(i)).join('') + '</div>' : '<div class="empty">Сумка порожня. Речі падають з монстрів у брамах — виносиш їх, коли виходиш зі здобиччю.</div>') + bulk +
    '<div class="setrow"><span>Автопродаж звичайних речей<small>сірі речі продаються одразу при виході з брами</small></span><button class="sw" role="switch" aria-checked="' + (!!S.settings.autoSell) + '" data-a="setting" data-v="autoSell" aria-label="Автопродаж"></button></div>' +
    (S.bagCap < 200 ? '<button class="btn gold wide" style="margin-top:10px" data-a="bagExpand">+20 місць · ' + ic('gem') + '150</button>' : ''));
  html += win('Кузня', '<p class="lead">Покращуй вдягнуті речі: кожен рівень +7% до їхніх характеристик. Перші два рівні — завжди успішні, далі шанс падає; при невдачі матеріали згорають, рівень лишається.</p><button class="btn blue wide" style="margin-top:10px" data-a="forge">' + ic('anvil') + 'Відкрити кузню</button>');
  html += win('Вівтар піднесення', '<p class="lead">Три непотрібні речі однієї рідкості — і Система викує одну річ наступної рідкості. Слот обираєш сам.</p><button class="btn blue wide" style="margin-top:10px" data-a="altar">' + ic('altar') + 'Відкрити вівтар</button>');
  return html;
}
function sellPrice(it){ return Math.round((5 + 2.5 * it.lvl) * RAR[it.r].sell * (1 + .2 * (it.up || 0))); }
function shardYield(it){ return RAR[it.r].sh + Math.floor(it.lvl / 10) + (it.up || 0); }
function statRows(it, cmpIt){
  const s = itemStats(it), c = cmpIt ? itemStats(cmpIt) : null;
  const keys = Object.keys(STAT_LABEL).filter(k => s[k] || (c && c[k]));
  const afk = {}; it.af.forEach(p => afk[p[0]] = 1);
  return '<ul class="statlist">' + keys.map(k => {
    const v = s[k] || 0; let d = '';
    if (c){ const dv = v - (c[k] || 0); if (Math.abs(dv) > (PCT_KEYS[k] ? .0005 : .5)) d = '<span class="delta ' + (dv > 0 ? 'up' : 'dn') + '">' + (dv > 0 ? '▲' : '▼') + (PCT_KEYS[k] ? pct(Math.abs(dv)) : fmt(Math.abs(dv))) + '</span>'; }
    return '<li class="' + (afk[k] ? 'af' : '') + '"><span>' + STAT_LABEL[k] + '</span><b>' + (v ? (PCT_KEYS[k] ? '+' + pct(v) : '+' + fmt(v)) : '—') + d + '</b></li>';
  }).join('') + '</ul>';
}
function itemHead(it){ const nm = it.slot === 'weapon' ? CLS[it.cls || S.hero.cls].weapon.slot : SLOT[it.slot].name; return '<div class="itemhead" style="--rcol:' + rcol(it.r) + '"><span class="cell" style="--rcol:' + rcol(it.r) + '">' + ic(itemIcon(it)) + '</span><div><b>' + esc(it.name) + (it.up ? ' +' + it.up : '') + '</b><small>' + RAR[it.r].name + ' · ' + nm + ' · ур. ' + it.lvl + ' · міць ' + fmt(itemPower(it)) + '</small></div></div>'; }
function itemSheetBag(id){
  const it = S.bag.find(i => i.id === id); if (!it) return;
  if (it.nw){ it.nw = 0; save(); }

function wheelSvg(){
  const n = WHEEL.length, R0 = 100;
  let s = '<svg class="wheel" viewBox="-104 -104 208 208" style="transform:rotate(' + UI.wheelRot + 'deg)" aria-hidden="true"><circle r="103" fill="#0b1630" stroke="#3b7cc9" stroke-width="2"/>';
  WHEEL.forEach((w, i) => {
    const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2;
    const x0 = Math.cos(a0) * R0, y0 = Math.sin(a0) * R0, x1 = Math.cos(a1) * R0, y1 = Math.sin(a1) * R0;
    s += '<path d="M0 0 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + R0 + ' ' + R0 + ' 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" fill="' + w.c + '" stroke="#3b7cc9" stroke-width=".8"/>';
    const am = (a0 + a1) / 2, cx = Math.cos(am) * 70, cy = Math.sin(am) * 70;
    s += '<g transform="translate(' + (cx - 11).toFixed(1) + ' ' + (cy - 11).toFixed(1) + ') scale(.92)" style="color:' + (w.icon === 'gem' || w.icon === 'soul' ? '#c9a8ff' : w.icon === 'coin' || w.icon === 'energy' ? '#f3c560' : '#9fd6ff') + '">' + ICONS[w.icon] + '</g>';

}

function newRun(type, gate){ return {type, gate:gate || null, floor:0, fight:0, bp:{xp:0, gold:0, shards:0, items:[], potHp:0}, kills:0, hp:null, mp:null, revived:false, stage:'fight', battle:null, lastAuto:false}; }
function farmPool(){
  const ri = rankIdx(S.hero.rank);
  const gs = GATES.filter(g => !g.trial && !g.endless && g.lvl <= S.hero.lvl && ri >= g.rank);
  const pool = []; gs.slice(-2).forEach(g => pool.push.apply(pool, g.mobs));
  return pool.length ? pool : ['rat'];
}
const ALL_MOBS = GATES.filter(g => g.mobs).reduce((a, g) => a.concat(g.mobs), []);
const ALL_GUARDS = GATES.filter(g => g.guards).reduce((a, g) => a.concat(g.guards), []);
const ALL_BOSSES = GATES.filter(g => g.boss && !g.trial).map(g => g.boss);
function fightPlan(run){
  if (run.type === 'farm') return {mid:pick(farmPool()), lvl:S.hero.lvl + (S.hero.lvl < 10 ? rint(0, 1) : rint(0, 2)), role:'normal'};
  const G = GATE[run.gate];
  if (G.trial) return run.fight < 2 ? {mid:G.elites[run.fight], lvl:G.lvl, role:'elite'} : {mid:G.boss, lvl:G.lvl + 1, role:'tboss'};
  const L = G.lvl + run.floor;
  if (G.endless){
    if (run.fight < 2) return {mid:pick(ALL_MOBS), lvl:L, role:'normal'};
    return (run.floor + 1) % 5 === 0 ? {mid:pick(ALL_BOSSES), lvl:L, role:'boss'} : {mid:pick(ALL_GUARDS), lvl:L, role:'guard'};
  }
  if (run.fight < 2) return {mid:pick(G.mobs), lvl:L, role:'normal'};
  if (run.floor < 2) return {mid:pick(G.guards), lvl:L, role:'guard'};
  return {mid:G.boss, lvl:L, role:'boss'};
}
function runLabel(run){
  if (run.type === 'farm') return 'Фарм-зона · монстр ' + (run.kills + 1);
  if (run.type === 'arena') return 'Арена · ' + esc(run.opp.name);
  const G = GATE[run.gate];
  if (G.trial) return G.name + ' · бій ' + (run.fight + 1) + '/3';
  return G.name + ' · поверх ' + (run.floor + 1) + (G.endless ? '' : '/3') + ' · бій ' + (run.fight + 1) + '/3';
}
function startGate(id){
  if (S.run) return resumeRun();
  const G = GATE[id], cost = gateCost(G);
  if (S.hero.lvl < G.lvl || rankIdx(S.hero.rank) < G.rank) return toast('Ця брама ще закрита');
  regenEnergy();
  if (S.energy < cost) return toast('Не вистачає енергії: потрібно ' + cost, 'red');
  if (S.energy >= ENERGY_MAX) S.energyTs = Date.now();
  S.energy -= cost;
  S.run = newRun('gate', id);
  startFight();
}
function startFarm(){
  if (S.run) return resumeRun();
  S.run = newRun('farm');

}
function startFight(){
  const run = S.run, plan = fightPlan(run);
  const kb = (run.type === 'gate' && S.hero.cls === 'swordsman') ? Math.min(.3, run.kills * .03) : 0;
  const hero = heroActor(run.hp, run.mp, {killBonus:kb});
  const foe = monsterActor(plan.mid, plan.lvl, plan.role, run.type === 'farm');
  const bg = run.type === 'farm' ? 'farm' : GATE[run.gate].bg;
  run.battle = newBattle(hero, foe, {bg, farm:run.type === 'farm'});
  run.battle.auto = !!run.lastAuto;
  run.stage = 'fight';
  saveLocal(); Cloud.queue();
  openBattle();
  if (run.battle.auto) scheduleAuto();
}
function startArena(oppId){
  if (S.run) return resumeRun();
  if (S.arena.fights <= 0) return toast('Бої на сьогодні закінчились');
  const o = findOpp(oppId); if (!o) return toast('Суперник пішов з арени');
  S.run = {type:'arena', opp:{id:o.id, name:o.name, cls:o.cls, lvl:o.lvl, rank:o.rank, rating:o.rating, live:!!o.live}, bp:{xp:0, gold:0, shards:0, items:[], potHp:0}, stage:'fight', kills:0};
  S.run.battle = newBattle(heroActor(null, null, {arena:true}), hunterActor(o), {arena:true, bg:'arena'});
  saveLocal();
  openBattle();
}
function resumeRun(){
  const run = S.run; if (!run) return;
  if (run.type === 'arena'){ if (run.battle && !run.battle.over){ openBattle(); return; } S.run = null; save(); render(); return; }
  if (run.stage === 'fight' && run.battle){ openBattle(); if (run.battle.auto) scheduleAuto(); return; }
  if (run.stage === 'dead' && run.battle){ openBattle(); deathSheet(); return; }
  if (run.stage === 'next'){ startFight(); return; }
  if (run.stage === 'won'){ openBattleShell(); showWonPanel(); return; }
  if (run.stage === 'floor'){ openBattleShell(); floorSheet(); return; }
  startFight();
}

function playEvents(events, done){
  let delay = 0;
  const vis = events.filter(e => ['hit','miss','heal','mana','stun','guard','shield','die','windup','buff','stunned','herodie'].indexOf(e.t) >= 0);
  vis.forEach((e, i) => {
    setTimeout(() => {
      Art.react(e);
      if (e.t === 'hit' && e.side === 'hero' && !e.dot) haptic(e.heavy || e.crit ? 'heavy' : 'light');
      else if (e.t === 'hit' && e.crit) haptic('rigid');
      if (e.t === 'hit') floater((e.dmg ? '-' + e.dmg : '') + (e.absorbed ? ' щит' : ''), e.side === 'foe' ? (e.crit ? 'crit' : (e.dot ? 'dot' : '')) : (e.dot ? 'dot' : 'hurt'), e.side);
      else if (e.t === 'miss') floater('Промах', 'miss', e.side);
      else if (e.t === 'heal' && e.amt >= 1) floater('+' + e.amt, 'heal', e.side);
      else if (e.t === 'mana') floater('+' + e.amt + ' мани', 'mana', e.side);
      else if (e.t === 'stun') floater('Оглушено!', 'miss', e.side);
      else if (e.t === 'guard') floater('Захист', 'mana', e.side);
      if (e.t === 'hit' || e.t === 'herodie'){ const sb = $('#stage'); if (sb && e.side === 'hero' && S.settings.fx){ sb.classList.remove('shake'); void sb.offsetWidth; sb.classList.add('shake'); } }
    }, delay);
    delay += (e.t === 'hit' || e.t === 'miss') ? 170 : 90;

}
function bAct(t, id){
