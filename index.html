function arenaOver(b){
  const run = S.run, A = S.arena, o = run.opp, win = b.result === 'win';
  const E = 1 / (1 + Math.pow(10, (o.rating - A.rating) / 400));
  const delta = win ? Math.max(6, Math.round(32 * (1 - E))) : -Math.max(4, Math.round(32 * E));
  A.rating = Math.max(0, A.rating + delta); A.best = Math.max(A.best, A.rating); A.fights = Math.max(0, A.fights - 1);
  let gold, cry = 0;
  if (win){ A.wins++; S.stats.arenaWins++; gold = 20 + 6 * S.hero.lvl; cry = 1; } else { A.losses++; gold = 5 + S.hero.lvl; }
  S.gold += gold; S.crystals += cry; S.stats.goldEarned += gold;
  const rv = (A.rivals || []).find(r => r.id === o.id); if (rv) rv.rating = Math.max(600, rv.rating - Math.round(delta * .6));
  S.run = null; pickOpponents(); save();
  setTimeout(() => openSheet(iiPlate(win ? 'Перемога' : 'Поразка', win ? 'gold' : 'red') +
    '<div class="result"><h3 class="' + (win ? '' : 'lose') + '">' + (win ? 'Перемога' : 'Поразка') + '</h3></div>' +
    '<div class="loot"><div class="li">' + ic('trophy') + 'Рейтинг: <b>' + (delta > 0 ? '+' : '−') + Math.abs(delta) + '</b> → ' + fmt(A.rating) + '</div><div class="li">' + ic('coin') + 'Золото: <b>+' + gold + '</b></div>' + (cry ? '<div class="li">' + ic('gem') + 'Кристал: <b>+1</b></div>' : '') + '<div class="li faint">Боїв на сьогодні: ' + A.fights + '/5</div></div>' +
    '<button class="btn blue wide" style="margin-top:14px" data-a="arenaDone">До арени</button>', {noClose:true}), 600);
}

/* ===================== TELEGRAM MINI APP ===================== */
const TG = (function(){
  const W = window.Telegram && window.Telegram.WebApp;
  return W && W.initData ? W : null;
})();
if (TG){
  try { TG.ready(); TG.expand(); } catch (e) {}
  try { TG.setHeaderColor('#04060d'); TG.setBackgroundColor('#04060d'); } catch (e) {}
  try { if (TG.setBottomBarColor) TG.setBottomBarColor('#04060d'); } catch (e) {}
  try { if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); } catch (e) {}

  const tgUser = TG.initDataUnsafe && TG.initDataUnsafe.user;
  if (tgUser && tgUser.first_name){
    const nm = String(tgUser.first_name).replace(/[^\p{L}\p{N} '’_-]/gu, '').trim().slice(0, 16);
    if (nm) defaultName = () => nm;
  }

  haptic = (kind) => {
    if (!S || !S.settings || !S.settings.fx || !TG.HapticFeedback) return;
    try {
      if (kind === 'success' || kind === 'error' || kind === 'warning') TG.HapticFeedback.notificationOccurred(kind);
      else TG.HapticFeedback.impactOccurred(kind);
    } catch (e) {}
  };

  const BB = TG.BackButton;
  if (BB){
    let shown = false;
    BB.onClick(() => {
      const closable = document.querySelector('.sheet-back .x');
      if (closable){ closeSheet(); return; }
      if (document.querySelector('.sheet-back')) return;
      if (!$('#battle').hidden) return;
      if (UI.view){ UI.view = null; render(); }
    });
    setInterval(() => {
      const want = !!(S && S.hero && (document.querySelector('.sheet-back .x') || (UI.view && $('#battle').hidden)));
      if (want === shown) return;
      shown = want;
      try { want ? BB.show() : BB.hide(); } catch (e) {}
    }, 250);
  }

  /* Saves go to Telegram CloudStorage (per user, per bot), so the hero follows the player across devices.
     Values are capped at 4096 chars, so the save is split into chunks; two alternating chunk sets keep
     an interrupted write from corrupting the previous save. */
  const CS = TG.CloudStorage;
  if (CS && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')){
    const call = fn => new Promise((res, rej) => { try { fn((err, val) => err ? rej(err) : res(val)); } catch (e) { rej(e); } });
    const getItem = k => call(cb => CS.getItem(k, cb));
    const getItems = ks => call(cb => CS.getItems(ks, cb));
    const setItem = (k, v) => call(cb => CS.setItem(k, v, cb));
    const CHUNK = 3900;
    Cloud.mode = 'tg';
    Cloud.label = 'прогрес зберігається у твоєму Telegram';
    Cloud.prefix = null;
    Cloud.init = async function(){
      try {
        const raw = await getItem('meta');
        if (raw){
          const meta = JSON.parse(raw);
          if (meta && meta.n > 0 && (meta.p === 'a' || meta.p === 'b')){
            const keys = []; for (let i = 0; i < meta.n; i++) keys.push(meta.p + i);
            const vals = await getItems(keys);
            const json = keys.map(k => (vals && vals[k]) || '').join('');
            let remote = null; try { remote = migrate(JSON.parse(json)); } catch (e) {}
            this.prefix = meta.p;
            if (remote && remote.hero && (!S.hero || (remote.savedAt || 0) > (S.savedAt || 0))){
              S = remote; this.lastJson = json; saveLocal(); onCloudAdopt();
            }
          }
        }
        this.ready = true;
        if (S.hero) this.queue(1500);
        onCloudReady();
      } catch (e) { this.ready = false; }
    };
    Cloud.flush = async function(){
      if (!this.ready || !S || !S.hero) return;
      if (this.writing){ this.pending = true; return; }
      const json = JSON.stringify(S);
      if (json === this.lastJson) return;
      const n = Math.ceil(json.length / CHUNK);
      if (n > 200) return;
      const p = this.prefix === 'a' ? 'b' : 'a';
      this.writing = true;
      try {
        for (let i = 0; i < n; i++) await setItem(p + i, json.slice(i * CHUNK, (i + 1) * CHUNK));
        await setItem('meta', JSON.stringify({p, n, at:S.savedAt, v:1}));
        this.prefix = p; this.lastJson = json;
      } catch (e) {}
      this.writing = false;
      if (this.pending){ this.pending = false; this.queue(); }
    };
    Cloud.loadRoster = async function(){};
  }
}

    openSheet(iiPlate('Подарункова скриня', 'gold') + '<div class="loot"><div class="li">' + ic('gem') + 'Кристали: <b>+100</b></div><div class="li">' + ic('pot_hp') + 'Зілля здоров’я: <b>+3</b></div><div class="li">' + ic('pot_mp') + 'Зілля мани: <b>+3</b></div>' +
      '<div class="itemrow" style="--rcol:' + rcol(it.r) + '"><span class="cell" style="--rcol:' + rcol(it.r) + '">' + ic(itemIcon(it)) + '</span><div><b>' + esc(it.name) + '</b><small>' + RAR[it.r].name + ' · у сумці</small></div></div></div>' +
      '<div class="stack" style="margin-top:14px"><button class="btn blue" data-a="equip" data-v="' + it.id + '">Вдягнути нагрудник</button><button class="btn red" data-a="toGates">' + ic('n_arena') + 'До бою</button></div>', {noClose:true});
  },
  toGates(){ closeSheet(); UI.tab = 'gates'; UI.view = null; render(); },
  bAct(d){ bAct(d.t, d.v); },
  bAuto(){ const b = S.run && S.run.battle; if (!b || b.over) return; b.auto = !b.auto; S.run.lastAuto = b.auto; updateBattle(); if (b.auto && !BX.busy) scheduleAuto(); else clearTimeout(BX.autoT); },
  bFlee(){ fleeSheet(); },
  doFlee(){
    const run = S.run; if (!run) return; closeSheet(); clearTimeout(BX.autoT);
    if (run.type === 'arena'){ const b = run.battle; b.over = true; b.result = 'lose'; arenaOver(b); return; }
    if (run.type === 'farm'){ if (run.battle && !run.battle.over){ const bl = run.battle.loot; run.bp.xp += bl.xp; run.bp.gold += bl.gold; run.bp.items = run.bp.items.concat(bl.items); } exitRun('farm'); return; }
    S.run = null; save(); closeBattle(); render(true); toast('Ти втік. Брама зачинилась разом зі здобиччю.', 'red');
  },
  nextFight(){ clearTimeout(BX.wonT); if (S.run && S.run.stage === 'next') startFight(); },
  farmNext(){ clearTimeout(BX.wonT); if (S.run && S.run.stage === 'won') startFight(); },
  farmExit(){ clearTimeout(BX.wonT); exitRun('farm'); },
  runExitAsk(){ if (S.energy >= 2){ UI.confirm = 'exit'; floorSheet(); } else exitRun('floor'); },
  runExitNo(){ UI.confirm = null; floorSheet(); },
  runExit(d){ UI.confirm = null; exitRun(d.v || 'floor'); },
  runDeeper(){
    const run = S.run; if (!run || S.energy < 2) return;
    regenEnergy(); if (S.energy >= ENERGY_MAX) S.energyTs = Date.now(); S.energy -= 2;
    run.floor++; run.fight = 0; run.hp = null; run.mp = null; run.floorBonus = 0;
    closeSheet(); startFight();
  },
  revive(){
    const run = S.run; if (!run || run.revived || S.crystals < 40 || !run.battle) return;
    S.crystals -= 40; run.revived = true;
    const b = run.battle; b.over = false; b.result = null; b.hero.hp = Math.round(b.hero.maxHp * .5);
    ['poison','bleed','stun','curse','blind','web'].forEach(k => { delete b.hero.st[k]; });
    log(b, '<span class="c">Система повертає тебе до життя</span>');
    b.intent = chooseIntent(b); run.stage = 'fight'; S.stats.deaths = Math.max(0, S.stats.deaths - 1);
    save(); closeSheet(); updateBattle();
  },
  acceptDeath(){ S.run = null; save(); closeSheet(); closeBattle(); render(true); toast('Здобич утрачено. Брама зачинилась.', 'red'); },
  again(d){ closeSheet(); if (d.v === 'farm') startFarm(); else startGate(d.v); },
  arenaDone(){ closeSheet(); closeBattle(); UI.tab = 'arena'; UI.view = null; render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target; if (!el || !el.dataset || !el.dataset.a || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
  e.preventDefault(); el.click();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'heroName'){ const b = $('[data-a="confirmName"]'); if (b) b.click(); } });
function tick(){
  if (!S || !S.hero) return;
  regenEnergy();
  if (checkDay() && !S.run && !UI.sheetOpen) render(true);
  document.querySelectorAll('[data-tick="en"]').forEach(el => { el.textContent = S.energy; });
  const eta = energyEta();
  document.querySelectorAll('[data-tick="eta"]').forEach(el => { el.textContent = eta ? '+1 через ' + fmtDur(eta.next) + ' · повна через ' + fmtDur(eta.full) : 'Енергія повна'; });
  document.querySelectorAll('[data-tick="reset"]').forEach(el => { el.textContent = 'До скидання: ' + fmtDur(msToMidnight()); });
}
function onCloudAdopt(){
  closeSheet();
  if (!S.hero) return;
  const intro = $('#intro'); intro.hidden = true; intro.innerHTML = ''; document.body.style.overflow = '';
  closeBattle(); render();
  if (S.run) resumeRun();
  toast('Прогрес підтягнуто з твого акаунта', 'gold');
}
function onCloudReady(){ if (S.hero && !S.run && !UI.sheetOpen) rerender(); }
window.addEventListener('resize', () => { Art.resize(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.hero){ saveLocal(); Cloud.flush(); } });
function boot(hot){
  hot = hot || {};
  try { document.documentElement.lang = 'uk'; } catch (e) {}
  S = hot.state ? migrate(hot.state) : loadLocal();
  if (!S) S = freshState();
  if (hot.ui){ UI.tab = hot.ui.tab || UI.tab; UI.view = hot.ui.view || null; }
  if (S.hero){
    regenEnergy(); checkDay();
    if (!S.arena.rivals || !S.arena.rivals.length) S.arena.rivals = genRivals();
    render();
    if (S.run) resumeRun();
  } else showIntro('crash');
  setInterval(tick, 1000);
  Cloud.init();
  const H = window.claude && window.claude.hot;
  if (H && typeof H.snapshot === 'function'){ try { H.snapshot(() => ({state:S, ui:{tab:UI.tab, view:UI.view}})); } catch (e) {} }
}
(function start(){
  const H = window.claude && window.claude.hot;
  if (H && typeof H.ready === 'function'){ try { H.ready(boot); return; } catch (e) {} }
  boot((H && H.data) || {});
})();

})();
</script>
